<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codeforces Friends</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="App">
      <section class="content">
        <div class="rank-spine"></div>

        <div class="term-header">
          <div class="term-dots"><span></span><span></span><span></span></div>
          <div class="term-path"><b>~/cf-friends</b>.list</div>
        </div>

        <div class="container">
          <form id="login-form">
            <label for="userHandle" class="UserHandle">Add New Friend</label>
            <div class="input-group">
              <input
                type="text"
                id="userHandle"
                name="userHandle"
                placeholder="enter handle..."
                required
                autocomplete="off"
              />
            </div>

            <div class="update-button">
              <button type="button" id="btn-save" class="btn btn-white">
                Save
              </button>
              <button type="button" id="btn-export" class="btn btn-outline">
                Export to File
              </button>
            </div>
          </form>

          <p id="errorMessage" class="error-message"></p>

          <div id="table-container">
            <table id="table">
              <thead>
                <tr>
                  <th>Handles</th>
                  <th class="text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
    <script src="/scripts/popup-script.js"></script>
  </body>
</html>
